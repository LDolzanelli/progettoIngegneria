databaseChangeLog:
  - changeSet:
      id:  1
      author: lorenzo.dolzanelli
      changes:
        - sqlFile:
            path: db/init/createDB.sql    # relative or absolute path to your SQL file
            encoding: UTF-8               # optional: specify encoding
            splitStatements: true         # optional: split on ;
            endDelimiter: ";"             # optional: default is ;
        - sqlFile:
            path: db/init/populateDB.sql  # relative or absolute path to your SQL file
            encoding: UTF-8               # optional: specify encoding
            splitStatements: true         # optional: split on ;
            endDelimiter: ";"             # optional: default is ;