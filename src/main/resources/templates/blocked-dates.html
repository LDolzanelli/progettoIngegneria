<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Date Picker Form</title>

    <!-- bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">

    <!-- bootstrap datepicker CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css" rel="stylesheet">

</head>
<body>
<nav class="navbar navbar-expand-lg bg-light shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold fs-4" href="/">Centro Visite</a>
    </div>
</nav>

<div class="container mb-5">
    <h1 class="mb-4">Date non utilizzabili</h1>

    <div class="form-container">

        <form id="blocked-dates-form">
            <div class="mb-3">
                <label for="blocked-dates-input" class="form-label">Scegli le date non utilizzabili per le visite</label>
                <div class="input-group" id="input-container">
                    <input type="text" class="form-control" id="blocked-dates-input" placeholder="Clicca qui per selezionare le date" readonly>
                    <span class="input-group-text">
                            <i class="fas fa-calendar-alt"></i>
                            📅
                        </span>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">Invia</button>
                <button type="reset" class="btn btn-outline-secondary">Reset</button>
            </div>
        </form>

        <!-- Results Display -->
        <div id="results" class="mt-4" style="display: none;">
            <div class="alert alert-success">
                <h5>Registration Submitted Successfully!</h5>
                <div id="resultContent"></div>
            </div>
        </div>
    </div>
</div>

<!-- jQuery (required for bootstrap-datepicker) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

<!-- Bootstrap Datepicker JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>

<script>
    $(document).ready(function() {
        // Initialize date pickers
        $('#input-container input').datepicker({
            //autoclose: 'false',
            //format: 'dd/mm/yyyy',
            //todayHighlight: false,
            //startDate:
            //endDate:
            //startView: 'days',
            multidate: true,
            orientation: 'bottom auto'
        });

        // Form submission handler
        $('#blocked-dates-form').on('submit', async function(e) {
            e.preventDefault();

            // Valori date
            const blockedDatesInput = $('#blocked-dates-input').val();

            console.log("Date lette: " + blockedDatesInput);

            // divide l'input in un array contenente le singole date
            blockedDates = blockedDatesInput.split(',');

            for(i=0; i<blockedDates.length; i++)
                console.log("Data " + i + " : " + blockedDates[i]);

            //invio dati

           // try {
               const response = await fetch(`http://localhost:8080/api/blocked-dates/set`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(blockedDates)
                });

                if (response.ok) {
                    alert('Tipo di visita aggiunto con successo!');
                    $('#blocked-dates-form').reset();
                    $('#blocked-dates-form').classList.remove('was-validated');
                } else {
                    const errorText = await response.text();
                    alert('Errore nell\'aggiunta: ' + errorText);
                }
          //  } catch (error) {
          //     alert('Errore di rete o server: ' + error.message);
          //  }

    });

        // Reset form handler
        $('#blocked-dates-form').on('reset', function() {
            // Clear datepicker
            $('#blocked-dates-input, #eventDate').datepicker('clearDates');
        });
    });
</script>
</body>
</html>
