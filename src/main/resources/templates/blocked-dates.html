<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Date Non Utilizzabili</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css" rel="stylesheet">

    <style>
        .datepicker-inline {
            font-size: 1.2rem;
            width: 100%;
            display: block;
        }

        .datepicker table {
            width: 100%;
        }

        .datepicker td, .datepicker th {
            width: 3rem;
            height: 3rem;
            text-align: center;
            vertical-align: middle;
            font-size: 1rem;
            border-radius: 0.25rem;
        }


        .datepicker td.active,
        .datepicker td.active:hover {
            background-color: #6c757d !important;
            color: #fff;
            border-color: #6c757d !important;
            border-radius: 0.35rem;
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .datepicker td.day:hover {
            background-color: #e2e6ea;
            border-radius: 0.25rem;
        }

        .datepicker td.active.focus,
        .datepicker td.active:hover.focus {
            outline: none;
            box-shadow: none;
        }

        .datepicker {
            margin: 0 auto;
            float: none;
        }

        .datepicker-days .datepicker-switch {
            cursor: default;
        }

        .datepicker .datepicker-switch:hover {
            background-color: transparent !important;
            color: inherit !important;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-light shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold fs-4" href="/">Centro Visite</a>
    </div>
</nav>

<div class="container mb-5">
    <h1 class="mb-4">Date precluse</h1>

    <form id="blocked-dates-form">
        <div class="mb-3">
            <label class="form-label">Seleziona le date precluse</label>
            <div id="inline-datepicker"></div>
        </div>

        <div class="gap-2 d-flex justify-content-start">
            <button type="submit" class="btn btn-primary">Invia</button>
        </div>
    </form>

    <div id="results" class="mt-4" style="display: none;">
        <div class="alert alert-success">
            <h5>Registrazione completata con successo!</h5>
            <div id="resultContent"></div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/locales/bootstrap-datepicker.it.min.js"></script>

<script>
    function formatDateLocal(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    $(async function () {
        try {
            const monthToUpdate = await fetch('http://localhost:8080/api/blocked-dates/month-to-update')
                .then(res => res.ok ? res.json() : Promise.reject('Errore mese'));

            const now = new Date();
            let year = now.getFullYear();

            // Se il mese da aggiornare è prima del mese corrente, si va all'anno successivo
            if (monthToUpdate < now.getMonth() + 1) {
                year += 1;
            }

            const firstDay = new Date(year, monthToUpdate - 1, 1);
            const lastDay = new Date(year, monthToUpdate, 0);

            $('#inline-datepicker').datepicker({
                format: 'yyyy-mm-dd',
                todayHighlight: false,
                multidate: true,
                orientation: 'bottom auto',
                defaultViewDate: firstDay,
                startDate: firstDay,
                endDate: lastDay,
                language: 'it',
                maxViewMode: 0,
                beforeShowMonth: () => ({ enabled: false }),
                beforeShowYear: () => ({ enabled: false }),
            });

            const blockedDates = await fetch('http://localhost:8080/api/blocked-dates/month-dates')
                .then(res => res.ok ? res.json() : []);

            if (blockedDates.length > 0) {
                const dateObjects = blockedDates.map(dateStr => new Date(dateStr + 'T00:00:00'));
                $('#inline-datepicker').datepicker('setDate', dateObjects);
            } else {
                setTimeout(() => {
                    const dp = $('#inline-datepicker').data('datepicker');
                    dp.viewDate = firstDay;
                    dp._fill(); // forza il rendering del mese
                }, 0);
            }

            let selectedDates = blockedDates;

            $('#inline-datepicker').on('changeDate', function () {
                selectedDates = $('#inline-datepicker').datepicker('getDates').map(formatDateLocal);
                console.log("Date selezionate:", selectedDates);
            });

            $('#blocked-dates-form').on('submit', async function (e) {
                e.preventDefault();
                const response = await fetch('http://localhost:8080/api/blocked-dates/set', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dateList: selectedDates })
                });
                if (response.ok) {
                    alert('Date bloccate aggiornate con successo!');
                } else {
                    alert('Errore: ' + await response.text());
                }
            });

        } catch (err) {
            alert('Errore caricamento dati: ' + err);
        }
    });
</script>
</body>
</html>
