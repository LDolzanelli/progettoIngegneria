<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inserisci aree di interesse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <th:block th:if="${success}">
        <meta http-equiv="refresh" content="1.5;url=/"/>
    </th:block>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        .btn-lg {
            padding: 0.75rem 1.2rem;
            font-size: 1.05rem;
            border-radius: 0.75rem;
        }
        h1 {
            font-weight: 600;
        }
        p.text-muted {
            font-size: 1rem;
        }
    </style>
</head>
<body>
<main class="container text-center mt-5 pt-5">
    <div class="glass-card mx-auto col-md-8 col-lg-6">
        <h1 class="mb-3">Aggiunta corpo dati</h1>
        <p class="text-muted mb-4">Inserisci uno o più comuni e relative province da aggiungere all'elenco della zona di interesse</p>

        <form method="post" th:action="@{/insert-areas-of-interest}">
            <div id="towns-container">
                <div class="row g-2 mb-3 town-group align-items-center">
                    <div class="col-7">
                        <input type="text" class="form-control" name="towns" placeholder="Località" required/>
                    </div>
                    <div class="col-5">
                        <input type="text" class="form-control" name="provinces" placeholder="Provincia" maxlength="2" required/>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-outline-secondary mb-3 w-100 btn-lg" onclick="addTownInput()">
                + Aggiungi un'altra località
            </button>

            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>

            <button type="submit" class="btn btn-primary w-100 btn-lg">Aggiungi località</button>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function addTownInput() {
        const container = document.getElementById('towns-container');
        const newGroup = document.createElement('div');
        newGroup.classList.add('row', 'g-2', 'mb-3', 'town-group', 'align-items-center');
        newGroup.innerHTML = `
            <div class="col-6">
                <input type="text" class="form-control" name="towns" placeholder="Località" required />
            </div>
            <div class="col-4">
                <input type="text" class="form-control" name="provinces" placeholder="Provincia" maxlength="2" required />
            </div>
            <div class="col-2 d-flex align-items-center">
                <button type="button" class="btn btn-danger btn-sm w-100" onclick="removeTownInput(this)">–</button>
            </div>
        `;
        container.appendChild(newGroup);
    }

    function removeTownInput(button) {
        const group = button.closest('.town-group');
        group.remove();
    }
</script>
</body>
</html>
