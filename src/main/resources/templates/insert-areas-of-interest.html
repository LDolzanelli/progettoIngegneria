<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inserisci aree di interesse</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <th:block th:if="${success}">
        <meta http-equiv="refresh" content="1.5;url=/"/>
    </th:block>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-light shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold fs-4" href="/">Centro Visite</a>
    </div>
</nav>
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-12 col-md-6 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="card-title mb-3 text-center">
                        Aggiunta corpo dati
                    </h1>
                    <p class="text-center mb-4">
                        Inserisci uno o più comuni e relative province da aggiungere all'elenco della zona di interesse
                    </p>

                    <form method="post" th:action="@{/insert-areas-of-interest}">
                        <div id="towns-container">
                            <div class="row g-2 mb-3 town-group align-items-center">
                                <div class="col-7">
                                    <input
                                            type="text"
                                            class="form-control"
                                            name="towns"
                                            placeholder="Località"
                                            required
                                    />
                                </div>
                                <div class="col-5">
                                    <input
                                            type="text"
                                            class="form-control"
                                            name="provinces"
                                            placeholder="Provincia"
                                            maxlength="2"
                                            required
                                    />
                                </div>
                            </div>
                        </div>

                        <button type="button" class="btn btn-outline-secondary mb-3 w-100" onclick="addTownInput()">
                            + Aggiungi un'altra località
                        </button>

                        <div
                                th:if="${error}"
                                class="alert alert-danger"
                                role="alert"
                                th:text="${error}"
                        ></div>

                        <div
                                th:if="${success}"
                                class="alert alert-success"
                                role="alert"
                                th:text="${success}"
                        ></div>

                        <button type="submit" class="btn btn-primary w-100">
                            Aggiungi località
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function addTownInput() {
        const container = document.getElementById('towns-container');
        const newGroup = document.createElement('div');
        newGroup.classList.add('row', 'g-2', 'mb-3', 'town-group', 'align-items-center');
        newGroup.innerHTML = `
            <div class="col-6">
                <input type="text" class="form-control" name="towns" placeholder="Località" required />
            </div>
            <div class="col-4">
                <input type="text" class="form-control" name="provinces" placeholder="Provincia" maxlength="2" required />
            </div>
            <div class="col-2 d-flex align-items-center">
                <button type="button" class="btn btn-danger btn-sm w-100" onclick="removeTownInput(this)">–</button>
            </div>
        `;
        container.appendChild(newGroup);
    }

    function removeTownInput(button) {
        const group = button.closest('.town-group');
        group.remove();
    }
</script>
</body>
</html>
