<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrazione Utente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        .btn-lg {
            padding: 0.75rem 1.2rem;
            font-size: 1.05rem;
            border-radius: 0.75rem;
        }
        h1 {
            font-weight: 600;
        }
        p.text-muted {
            font-size: 1rem;
        }
    </style>
</head>
<body>

<main class="container text-center mt-5 pt-5">
    <div class="glass-card mx-auto col-md-6 col-lg-5">
        <h1 class="mb-4">Registrazione Utente</h1>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <form method="post" th:action="@{/register-user}">
            <div class="mb-3 text-start">
                <label for="nickname" class="form-label">Nickname</label>
                <input type="text" class="form-control" id="nickname" name="nickname" required>
            </div>

            <div class="mb-3 text-start">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="mb-3 text-start">
                <label for="confirmPassword" class="form-label">Conferma Password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-lg mb-2">
                <i class="bi bi-person-plus"></i> Registra
            </button>
        </form>
    </div>
</main>

<script>
    document.querySelector("form").addEventListener("submit", function (e) {
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirmPassword").value;

        if (password !== confirm) {
            e.preventDefault();
            alert("Le password non coincidono!");
        }
    });
</script>

</body>
</html>
