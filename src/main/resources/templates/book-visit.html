<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8"/>
    <title>Prenotazione Visita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .visitor-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .visitor-row input {
            flex: 1;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2>Prenotazione visita: <span th:text="${visit.visitTypeTitle}">Titolo visita</span></h2>
    <p><strong>Data:</strong> <span th:text="${visit.date}">01/09/2025</span></p>
    <p><strong>Ora:</strong> <span th:text="${visit.startTime}">10:00</span></p>

    <form th:action="@{/book-visit}" method="post" id="bookingForm">
        <input type="hidden" name="visitId" th:value="${visit.id}" />
        <input type="hidden" name="userId" th:value="${userId}" />

        <div id="visitorsContainer" class="mb-3">
            <div class="visitor-row mb-2">
                <input type="text" class="form-control" name="visitorsNames" placeholder="Nome partecipante 1" required/>
                <button type="button" class="btn btn-danger btn-sm remove-btn" style="display:none;">&times;</button>
            </div>
        </div>

        <div class="d-flex gap-2 mb-3">
            <button type="button" class="btn btn-secondary" id="addVisitorBtn">Aggiungi partecipante</button>
        </div>

        <button type="submit" class="btn btn-primary">Conferma prenotazione</button>
    </form>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const maxTickets = [[${maxTickets}]];
    const maxParticipants = [[${visit.maxParticipants()}]];
    let currentCount = 1;

    const visitorsContainer = document.getElementById('visitorsContainer');
    const addBtn = document.getElementById('addVisitorBtn');
    const bookingForm = document.getElementById('bookingForm');


    addBtn.addEventListener('click', () => {
        if (currentCount < maxTickets && currentCount < maxParticipants) {
            currentCount++;
            const div = document.createElement('div');
            div.classList.add('visitor-row', 'mb-2');
            div.innerHTML = `
                <input type="text" class="form-control" name="visitorsNames" placeholder="Nome partecipante ${currentCount}" required/>
                <button type="button" class="btn btn-danger btn-sm remove-btn">&times;</button>
            `;
            visitorsContainer.appendChild(div);

            const removeBtn = div.querySelector('.remove-btn');
            removeBtn.addEventListener('click', () => {
                visitorsContainer.removeChild(div);
                currentCount--;
                updatePlaceholders();
            });
        } else {
            alert('Numero massimo di partecipanti raggiunto per questa visita!');
        }
    });

    function updatePlaceholders() {
        const rows = visitorsContainer.querySelectorAll('.visitor-row input');
        rows.forEach((input, index) => {
            input.placeholder = `Nome partecipante ${index + 1}`;
        });
    }

    bookingForm.addEventListener('submit', (event) => {
        const inputs = visitorsContainer.querySelectorAll('input[name="visitorsNames"]');
        const names = Array.from(inputs).map(i => i.value.trim().toLowerCase());
        const duplicates = names.filter((name, index) => names.indexOf(name) !== index);

        if (duplicates.length > 0) {
            event.preventDefault();
            alert('Non puoi inserire nomi duplicati tra i partecipanti!');
        }
    });
    /*]]>*/
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
