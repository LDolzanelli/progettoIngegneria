<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visualizza Tipi di Visita</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
    }
    nav.navbar {
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    main.container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 2rem;
      padding-bottom: 2rem;
    }
    #visitTypesGrid {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 1.5rem;
      padding: 1.75rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      margin-bottom: 1.5rem;
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .card-title {
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #2c3e50;
      font-size: 1.25rem;
    }
    .card-description {
      margin-bottom: 1rem;
      font-size: 1rem;
      color: #495057;
      line-height: 1.5;
    }
    .visit-details {
      background: rgba(248, 249, 250, 0.6);
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    .detail-row:last-child {
      margin-bottom: 0;
    }
    .detail-label {
      font-weight: 600;
      color: #6c757d;
      flex-shrink: 0;
      margin-right: 1rem;
    }
    .detail-value {
      color: #495057;
      text-align: right;
    }
    .btn-sm {
      border-radius: 0.5rem;
    }
    .btn + .btn {
      margin-left: 0.5rem;
    }
    .mt-auto {
      margin-top: auto;
    }
    .card .btn {
      padding: 0.375rem 0.75rem;
      line-height: 1.2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    @media (max-width: 768px) {
      .glass-card {
        max-width: 95%;
        padding: 1.25rem;
      }
      main.container {
        padding-left: 1rem;
        padding-right: 1rem;
      }
      .detail-row {
        flex-direction: column;
        gap: 0.25rem;
      }
      .detail-value {
        text-align: left;
        font-weight: 500;
      }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-light shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand text-primary fw-bold fs-4" href="/">Centro Visite</a>
  </div>
</nav>

<main class="container my-4">
  <h2 class="mb-4">Lista Tipi di Visita</h2>
  <button
          id="addVisitTypeBtn"
          type="button"
          class="btn btn-success mb-4"
          th:disabled="${!canAddVisits}"
          th:classappend="${role != 'configurator'} ? ' d-none' : ''">
    Aggiungi Tipo di Visita
  </button>

  <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>
  <div th:if="${visitTypes.isEmpty()}" id="noVisitTypesMessage" class="alert alert-info mb-3">
    Nessun tipo di visita disponibile.
  </div>

  <div id="visitTypesGrid" class="d-flex flex-column align-items-center w-100">
    <div class="glass-card mb-4" th:each="vt : ${visitTypes}">
      <h5 class="card-title" th:text="${vt.title}">Titolo</h5>
      <p class="card-description" th:text="${vt.description}">Descrizione</p>
      
      <div class="visit-details">
        <div class="detail-row">
          <span class="detail-label">Periodo:</span>
          <span class="detail-value">
            Dal <span th:text="${vt.startDate}"></span> al <span th:text="${vt.endDate}"></span>
          </span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Punto d'incontro:</span>
          <span class="detail-value" th:text="${vt.meetingPoint}"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Orario:</span>
          <span class="detail-value" th:text="${vt.startTime}"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Durata:</span>
          <span class="detail-value"><span th:text="${vt.duration}"></span> minuti</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Partecipanti:</span>
          <span class="detail-value">
            <span th:text="${vt.minParticipants}"></span> - <span th:text="${vt.maxParticipants}"></span>
          </span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Costo:</span>
          <span class="detail-value" th:text="${vt.free} ? 'Gratuita' : 'A pagamento'"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Giorni:</span>
          <span class="detail-value days-available" th:text="${vt.daysAvailable}"></span>
        </div>
        <div class="detail-row" th:if="${vt.volunteers != null and !#lists.isEmpty(vt.volunteers)}">
          <span class="detail-label">Volontari:</span>
          <span class="detail-value" th:text="${#strings.arrayJoin(vt.volunteers, ', ')}"></span>
        </div>
      </div>
      
      <div class="d-flex mt-auto gap-2 justify-content-end">
        <a th:href="@{|/add-volunteers?visitTypeId=${vt.id}|}" 
           class="btn btn-primary btn-sm" 
           th:if="${role == 'configurator'}" 
           th:classappend="${!vt.canBeModified} ? ' disabled' : ''">
          Aggiungi volontari
        </a>
        <div th:if="${role == 'configurator'}">
          <button type="button" 
                  class="btn btn-danger btn-sm" 
                  th:if="${vt.canBeRemoved}" 
                  th:attr="onclick=|deleteVisitType(${vt.id})|">
            Rimuovi
          </button>
          <button type="button" 
                  class="btn btn-secondary btn-sm" 
                  th:unless="${vt.canBeRemoved}" 
                  disabled>
            Non rimovibile
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<input
      type="hidden"
      id="thymeleafDataPresent"
      th:value="${visitTypes != null}"
    />

    <script>
      function getParamFromUrl(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      function formatDate(dateString) {
        if (!dateString) return dateString;
        try {
          const date = new Date(dateString);
          const day = date.getDate().toString().padStart(2, '0');
          const month = (date.getMonth() + 1).toString().padStart(2, '0');
          const year = date.getFullYear();
          return `${day}-${month}-${year}`;
        } catch (error) {
          return dateString; // Ritorna la data originale se c'è un errore
        }
      }

      async function loadVisitTypes() {
        const locationId = getParamFromUrl("locationId");
        const volunteerId = getParamFromUrl("volunteerId");

        let endpoint = null;

        if (locationId) {
          endpoint = `/api/visit-type/list/${locationId}`;
        } else if (volunteerId) {
          endpoint = `/api/visit-type/volunteer/${volunteerId}`;
        } else {
          console.warn("Nessun locationId o volunteerId fornito nell'URL.");
          return;
        }

        try {
          const resp = await fetch(endpoint);
          if (!resp.ok) throw new Error("HTTP error");

          const visitTypes = await resp.json();
          const grid = document.getElementById("visitTypesGrid");
          const noVisitTypesMessage = document.getElementById(
            "noVisitTypesMessage"
          );
          grid.innerHTML = "";

          if (visitTypes.length === 0) {
            noVisitTypesMessage.style.display = "block";
            return;
          } else {
            noVisitTypesMessage.style.display = "none";
          }

          visitTypes.forEach((vt) => {
            const cardDiv = document.createElement("div");
            cardDiv.className = "glass-card mb-4";

            const formattedStartDate = formatDate(vt.startDate);
            const formattedEndDate = formatDate(vt.endDate);

            const volunteersSection = vt.volunteers && vt.volunteers.length > 0 
              ? `<div class="detail-row">
                   <span class="detail-label">Volontari:</span>
                   <span class="detail-value">${vt.volunteers}</span>
                 </div>` 
              : '';

            cardDiv.innerHTML = `
              <h5 class="card-title">${vt.title}</h5>
              <p class="card-description">${vt.description || ""}</p>
              
              <div class="visit-details">
                <div class="detail-row">
                  <span class="detail-label">Periodo:</span>
                  <span class="detail-value">Dal ${formattedStartDate} al ${formattedEndDate}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Punto d'incontro:</span>
                  <span class="detail-value">${vt.meetingPoint}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Orario:</span>
                  <span class="detail-value">${vt.startTime}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Durata:</span>
                  <span class="detail-value">${vt.duration} minuti</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Partecipanti:</span>
                  <span class="detail-value">${vt.minParticipants} - ${vt.maxParticipants}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Costo:</span>
                  <span class="detail-value">${vt.free ? "Gratuita" : "A pagamento"}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Giorni:</span>
                  <span class="detail-value days-available">${vt.daysAvailable}</span>
                </div>
                ${volunteersSection}
              </div>
            `;
            grid.appendChild(cardDiv);
          });
        } catch (error) {
          console.error("Errore caricamento dati:", error);
          alert("Errore nel caricamento dei tipi di visita");
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        // Formatta le date nei dati Thymeleaf
        const formatThymeleafDates = () => {
          const detailValues = document.querySelectorAll('.detail-value');
          detailValues.forEach(element => {
            const text = element.textContent;
            // Cerca pattern di date nel formato yyyy-mm-dd
            const datePattern = /(\d{4}-\d{2}-\d{2})/g;
            if (datePattern.test(text)) {
              const newText = text.replace(datePattern, (match) => formatDate(match));
              element.textContent = newText;
            }
          });
        };

        const daysElements = document.querySelectorAll(".days-available");
        const dayMap = {
          MONDAY: "Lunedì",
          TUESDAY: "Martedì",
          WEDNESDAY: "Mercoledì",
          THURSDAY: "Giovedì",
          FRIDAY: "Venerdì",
          SATURDAY: "Sabato",
          SUNDAY: "Domenica",
        };
        const orderedDays = Object.keys(dayMap);

        daysElements.forEach((element) => {
          try {
            const daysText = element.textContent;
            const daysArray = daysText.replace(/[\[\]]/g, "").split(/\s*,\s*/);

            if (daysArray.length && daysArray[0] !== "") {
              daysArray.sort(
                (a, b) => orderedDays.indexOf(a) - orderedDays.indexOf(b)
              );
              element.textContent = daysArray
                .map((d) => dayMap[d.trim().toUpperCase()] || d)
                .join(", ");
            } else {
              element.textContent = "Nessun giorno selezionato";
            }
          } catch (e) {
            element.textContent = "Giorni non disponibili";
          }
        });

        const locationId = getParamFromUrl("locationId");
        const addBtn = document.getElementById("addVisitTypeBtn");
        if (addBtn) {
          const locationId = getParamFromUrl("locationId");

          addBtn.addEventListener("click", () => {
            if (!addBtn.disabled) {
              window.location.href = `/add-visittype?locationId=${encodeURIComponent(locationId)}`;
            }
          });
        }

        const isThymeleafDataPresent =
          document.getElementById("thymeleafDataPresent")?.value === "true";
        
        if (isThymeleafDataPresent) {
          formatThymeleafDates();
        } else {
          loadVisitTypes();
        }
      });
    </script>

    <script>
      async function deleteVisitType(id) {
        if (!confirm("Sei sicuro di voler eliminare questo tipo di visita?"))
          return;

        try {
          const resp = await fetch(`/api/visit-type/delete/${id}`, {
            method: "DELETE",
          });

          if (resp.ok) {
            alert("Tipo di visita eliminato con successo!");
            location.reload();
          } else {
            const errorText = await resp.text();
            alert("Errore durante l'eliminazione: " + errorText);
          }
        } catch (error) {
          console.error("Errore:", error);
          alert("Errore di rete durante l'eliminazione");
        }
      }
    </script>
  </body>
</html>
