<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Aggiungi Luogo</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
            padding-top: 4rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 700px;
            margin-bottom: 3rem;
        }

        .btn-lg {
            padding: 0.85rem 1.2rem;
            font-size: 1.1rem;
            border-radius: 0.75rem;
        }

        h1 {
            font-weight: 600;
        }

        fieldset {
            border-radius: 0.75rem;
        }

        legend {
            font-size: 1rem;
            font-weight: 500;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 10;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold fs-4" href="/">
            <i class="bi bi-building"></i> Centro Visite
        </a>
    </div>
</nav>

<main class="container d-flex justify-content-center mt-5 pt-5">
    <div class="glass-card">
        <h1 class="mb-4">Aggiungi un nuovo luogo di interesse</h1>

        <form id="addLocationForm" class="needs-validation" novalidate onsubmit="submitLocation(event)">
            <div class="mb-3">
                <label for="name" class="form-label">Nome:</label>
                <input type="text" id="name" name="name" class="form-control" required/>
                <div class="invalid-feedback">Inserire il nome della location.</div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Descrizione:</label>
                <textarea id="description" name="description" class="form-control" rows="3"></textarea>
            </div>

            <fieldset class="border p-3 mb-3">
                <legend class="float-none w-auto px-2">Indirizzo</legend>
                <div class="mb-3">
                    <label for="street" class="form-label">Via:</label>
                    <input type="text" id="street" name="street" class="form-control" required/>
                    <div class="invalid-feedback">Inserire la via.</div>
                </div>
                <div class="mb-3">
                    <label for="number" class="form-label">Numero civico:</label>
                    <input type="text" id="number" name="number" class="form-control" required/>
                    <div class="invalid-feedback">Inserire il numero.</div>
                </div>
                <div class="mb-3">
                    <label for="town" class="form-label">Paese:</label>
                    <select id="town" name="town" class="form-select" required>
                        <option value="" selected disabled>Selezionare il paese</option>
                    </select>
                    <div class="invalid-feedback">Selezionare un paese.</div>
                </div>
            </fieldset>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-success btn-lg">
                    <i class="bi bi-check-circle"></i> Conferma aggiunta luogo
                </button>
                <a href="/view-locations" class="btn btn-secondary btn-lg">
                    <i class="bi bi-arrow-left-circle"></i> Tornare all'elenco dei luoghi
                </a>
            </div>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    (async () => {
        'use strict';

        const form = document.getElementById('addLocationForm');
        const townSelect = document.getElementById('town');

        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);

        let townProvinceMap = {};
        try {
            const response = await fetch('/api/area-of-interest/townProvinceMap');
            townProvinceMap = await response.json();

            Object.keys(townProvinceMap).forEach(town => {
                const option = document.createElement('option');
                option.value = town;
                option.textContent = town;
                townSelect.appendChild(option);
            });
        } catch (err) {
            console.error('Errore nel caricamento di towns/province:', err);
        }

        form.addEventListener('submit', async event => {
            event.preventDefault();

            if (!form.checkValidity()) return;

            const selectedTown = townSelect.value;
            const province = townProvinceMap[selectedTown];

            const data = {
                name: form.name.value,
                description: form.description.value,
                address: {
                    street: form.street.value,
                    streetNumber: form.number.value,
                    town: selectedTown,
                    province: province
                },
                visitTypes: []
            };

            try {
                const response = await fetch('/api/location/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert('Location aggiunta con successo!');
                    form.reset();
                    form.classList.remove('was-validated');
                } else {
                    const errorText = await response.text();
                    alert('Errore nell\'aggiunta della location: ' + errorText);
                }
            } catch (error) {
                alert('Errore di rete o server: ' + error.message);
            }
        });
    })();
</script>
</body>
</html>
