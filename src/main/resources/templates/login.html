<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        .btn-lg {
            padding: 0.75rem 1.2rem;
            font-size: 1.05rem;
            border-radius: 0.75rem;
        }
        h1 {
            font-weight: 600;
        }
        p.text-muted {
            font-size: 1rem;
        }
        a.text-primary {
            text-decoration: none;
        }
    </style>
</head>
<body>

<main class="container text-center">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="glass-card">
                <h1 class="mb-4">Centro Visite</h1>

                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    Login fallito: credenziali errate
                </div>

                <div th:if="${param.logout}" class="alert alert-success" role="alert">
                    Logout effettuato con successo
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3 text-start">
                        <label for="username" class="form-label">Nickname:</label>
                        <input type="text" class="form-control" id="username" name="username" required />
                    </div>

                    <div class="mb-3 text-start">
                        <label for="password" class="form-label">Password:</label>
                        <input type="password" class="form-control" id="password" name="password" required />
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>

                    <div class="text-center">
                        <a th:href="@{/register-user}" class="text-primary small">
                            <i class="bi bi-person-plus"></i> Registra nuovo utente
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
