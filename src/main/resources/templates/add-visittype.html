<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <title>Aggiungi tipo di visita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg bg-light shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold fs-4" href="/">Centro Visite</a>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">Aggiungi un tipo di visita</h1>

    <form id="visitTypeForm" class="needs-validation" novalidate onsubmit="submitVisitType(event)">
        <div class="mb-3">
            <label for="title" class="form-label">Titolo:</label>
            <input type="text" id="title" name="title" class="form-control" required />
            <div class="invalid-feedback">Inserire il titolo della visita.</div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Descrizione:</label>
            <textarea id="description" name="description" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label for="meetingPoint" class="form-label">Punto di ritrovo:</label>
            <input type="text" id="meetingPoint" name="meetingPoint" class="form-control" required />
            <div class="invalid-feedback">Inserire il punto di ritrovo.</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Giorni disponibili:</label>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="daysAvailable" value="MONDAY" id="monday"><label class="form-check-label" for="monday">Lunedì</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="daysAvailable" value="TUESDAY" id="tuesday"><label class="form-check-label" for="tuesday">Martedì</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="daysAvailable" value="WEDNESDAY" id="wednesday"><label class="form-check-label" for="wednesday">Mercoledì</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="daysAvailable" value="THURSDAY" id="thursday"><label class="form-check-label" for="thursday">Giovedì</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="daysAvailable" value="FRIDAY" id="friday"><label class="form-check-label" for="friday">Venerdì</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="daysAvailable" value="SATURDAY" id="saturday"><label class="form-check-label" for="saturday">Sabato</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="daysAvailable" value="SUNDAY" id="sunday"><label class="form-check-label" for="sunday">Domenica</label></div>
        </div>

        <div id="weekdayWarning" class="alert alert-warning d-none" role="alert">
            Seleziona almeno un giorno della settimana per poter scegliere una data.
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="startDate" class="form-label">Data inizio:</label>
                <input type="text" id="startDate" name="startDate" class="form-control" required disabled />
                <div class="invalid-feedback">Inserire la data di inizio.</div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="endDate" class="form-label">Data fine:</label>
                <input type="text" id="endDate" name="endDate" class="form-control" required disabled />
                <div class="invalid-feedback">Inserire la data di fine.</div>
            </div>
        </div>

        <div class="mb-3">
            <label for="startTime" class="form-label">Ora di inizio (es. 14:30):</label>
            <input type="time" id="startTime" name="startTime" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="duration" class="form-label">Durata (minuti):</label>
            <input type="number" id="duration" name="duration" class="form-control" min="1" required />
        </div>

        <div class="mb-3">
            <label for="minParticipants" class="form-label">Minimo partecipanti:</label>
            <input type="number" id="minParticipants" name="minParticipants" class="form-control" min="1" required />
        </div>

        <div class="mb-3">
            <label for="maxParticipants" class="form-label">Massimo partecipanti:</label>
            <input type="number" id="maxParticipants" name="maxParticipants" class="form-control" min="1" required />
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="isFree" name="isFree" />
            <label class="form-check-label" for="isFree">Visita gratuita</label>
        </div>

        <div class="mb-3">
            <label for="volunteers">Seleziona volontari:</label>
            <select id="volunteers" name="volunteers" multiple required>
                <option th:each="vol : ${volunteers}" th:value="${vol.nickname}" th:text="${vol.nickname}"></option>
            </select>
            <a href="/register-user" class="btn btn-link p-0 mt-2">+ Aggiungi nuovo volontario</a>
        </div>

        <button type="submit" class="btn btn-success">Aggiungi tipo di visita</button>
        <a href="/view-locations" class="btn btn-secondary ms-2">Torna alla lista luoghi</a>
    </form>
</div>

<!-- Librerie -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<script>
    let blockedDates = new Set();
    let allowedWeekdays = [];

    document.addEventListener("DOMContentLoaded", async () => {
        await fetchBlockedDates();
        updateAllowedWeekdays();

        document.querySelectorAll('input[name="daysAvailable"]').forEach(cb =>
            cb.addEventListener('change', () => {
                updateAllowedWeekdays();
                updateFlatpickrInstances();
                resetInvalidDates();
            })
        );

        initFlatpickr("startDate");
        initFlatpickr("endDate");

        new Choices('#volunteers', {
            removeItemButton: true,
            placeholderValue: 'Seleziona volontari',
            noResultsText: 'Nessun volontario trovato',
            itemSelectText: '',
            shouldSort: false
        });
    });

    async function fetchBlockedDates() {
        try {
            const res = await fetch("/api/blocked-dates/get");
            const dates = await res.json();
            blockedDates = new Set(dates);
        } catch (err) {
            console.error("Errore nel caricamento delle date bloccate:", err);
        }
    }

    function updateAllowedWeekdays() {
        allowedWeekdays = Array.from(document.querySelectorAll('input[name="daysAvailable"]:checked'))
            .map(cb => ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"].indexOf(cb.value));

        const warning = document.getElementById('weekdayWarning');
        const startInput = document.getElementById('startDate');
        const endInput = document.getElementById('endDate');

        const enabled = allowedWeekdays.length > 0;
        warning.classList.toggle('d-none', enabled);
        startInput.disabled = !enabled;
        endInput.disabled = !enabled;
    }

    function isDateDisabled(date) {
        const iso = date.toISOString().split('T')[0];
        const weekday = date.getDay();
        return blockedDates.has(iso) || !allowedWeekdays.includes(weekday);
    }

    function initFlatpickr(id) {
        flatpickr(`#${id}`, {
            dateFormat: "Y-m-d",
            disable: [date => isDateDisabled(date)],
            locale: "it"
        });
    }

    function updateFlatpickrInstances() {
        flatpickr("#startDate").set("disable", [date => isDateDisabled(date)]);
        flatpickr("#endDate").set("disable", [date => isDateDisabled(date)]);
    }

    function resetInvalidDates() {
        ['startDate', 'endDate'].forEach(id => {
            const input = document.getElementById(id);
            if (input.value && isDateDisabled(new Date(input.value))) {
                input._flatpickr.clear();
            }
        });
    }

    async function submitVisitType(event) {
        event.preventDefault();
        const form = event.target;
        if (!form.checkValidity()) {
            form.classList.add('was-validated');
            return;
        }

        const startDate = new Date(form.startDate.value);
        const endDate = new Date(form.endDate.value);
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        if (startDate <= today) {
            alert('La data di inizio deve essere successiva a oggi.');
            return;
        }

        if (endDate < startDate) {
            alert('La data di fine deve essere successiva o uguale alla data di inizio.');
            return;
        }

        const maxParticipants = parseInt(form.maxParticipants.value);
        const minParticipants = parseInt(form.minParticipants.value);
        if (minParticipants >= maxParticipants) {
            alert('Numero di partecipanti minimi maggiore dei partecipanti massimi.');
            return;
        }

        const locationId = new URLSearchParams(window.location.search).get('locationId');
        if (!locationId) {
            alert('ID della location mancante.');
            return;
        }

        const data = {
            title: form.title.value,
            description: form.description.value,
            meetingPoint: form.meetingPoint.value,
            startDate: form.startDate.value,
            endDate: form.endDate.value,
            startTime: form.startTime.value,
            duration: parseInt(form.duration.value),
            maxParticipants,
            minParticipants,
            isFree: form.isFree.checked,
            daysAvailable: Array.from(document.querySelectorAll('input[name="daysAvailable"]:checked')).map(cb => cb.value),
            volunteers: Array.from(form.volunteers.selectedOptions).map(opt => opt.value)
        };

        try {
            const response = await fetch(`/api/visit-type/add/${locationId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert('Tipo di visita aggiunto con successo!');
                form.reset();
                form.classList.remove('was-validated');
            } else {
                const errorText = await response.text();
                alert('Errore nell\'aggiunta: ' + errorText);
            }
        } catch (error) {
            alert('Errore di rete o server: ' + error.message);
        }
    }
</script>
</body>
</html>
