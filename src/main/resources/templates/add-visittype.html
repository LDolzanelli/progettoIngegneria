<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aggiungi tipo di visita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Aggiungi un tipo di visita</h1>

    <form id="visitTypeForm" class="needs-validation" novalidate onsubmit="submitVisitType(event)">
        <div class="mb-3">
            <label for="title" class="form-label">Titolo:</label>
            <input type="text" id="title" name="title" class="form-control" required />
            <div class="invalid-feedback">Inserire il titolo della visita.</div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Descrizione:</label>
            <textarea id="description" name="description" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label for="meetingPoint" class="form-label">Punto di ritrovo:</label>
            <input type="text" id="meetingPoint" name="meetingPoint" class="form-control" required />
            <div class="invalid-feedback">Inserire il punto di ritrovo.</div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="startDate" class="form-label">Data inizio:</label>
                <input type="date" id="startDate" name="startDate" class="form-control" required />
                <div class="invalid-feedback">Inserire la data di inizio.</div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="endDate" class="form-label">Data fine:</label>
                <input type="date" id="endDate" name="endDate" class="form-control" required />
                <div class="invalid-feedback">Inserire la data di fine.</div>
            </div>
        </div>

        <div class="mb-3">
            <label for="startTime" class="form-label">Ora di inizio (es. 14:30):</label>
            <input type="time" id="startTime" name="startTime" class="form-control" required />
            <div class="invalid-feedback">Inserire l'orario di inizio.</div>
        </div>

        <div class="mb-3">
            <label for="duration" class="form-label">Durata (minuti):</label>
            <input type="number" id="duration" name="duration" class="form-control" min="1" required />
            <div class="invalid-feedback">Inserire la durata.</div>
        </div>

        <div class="mb-3">
            <label for="maxParticipants" class="form-label">Massimo partecipanti:</label>
            <input type="number" id="maxParticipants" name="maxParticipants" class="form-control" min="1" required />
            <div class="invalid-feedback">Inserire il numero massimo di partecipanti.</div>
        </div>

        <button type="submit" class="btn btn-success">Aggiungi tipo di visita</button>
        <a href="/view-locations" class="btn btn-secondary ms-2">Torna alla lista luoghi</a>
    </form>
</div>

<script>
    async function submitVisitType(event) {
        event.preventDefault();

        const form = event.target;
        if (!form.checkValidity()) {
            form.classList.add('was-validated');
            return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const locationId = urlParams.get('locationId');

        if (!locationId) {
            alert('ID della location mancante.');
            return;
        }

        // Preparo i dati da inviare, senza locationId nel body
        const data = {
            title: form.title.value,
            description: form.description.value,
            meetingPoint: form.meetingPoint.value,
            startDate: form.startDate.value,
            endDate: form.endDate.value,
            startTime: form.startTime.value,
            duration: parseInt(form.duration.value),
            maxParticipants: parseInt(form.maxParticipants.value)
        };

        try {
            const response = await fetch(`/api/visit-type/add/${locationId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert('Tipo di visita aggiunto con successo!');
                form.reset();
                form.classList.remove('was-validated');
            } else {
                const errorText = await response.text();
                alert('Errore nell\'aggiunta: ' + errorText);
            }
        } catch (error) {
            alert('Errore di rete o server: ' + error.message);
        }
    }

    // Bootstrap validation
    (() => {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>

</body>
</html>
