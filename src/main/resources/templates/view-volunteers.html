<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Volontari e Visite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
    }
    nav.navbar {
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    main.container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 2rem;
      padding-bottom: 2rem;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 1.5rem;
      padding: 1.5rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
    }
    .card-header {
      border-radius: 1rem 1rem 0 0;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
    }
    .card-body {
      padding: 0.75rem 1rem 1rem 1rem;
    }
    .btn-sm {
      border-radius: 0.5rem;
    }
    .btn + .btn {
      margin-left: 0.5rem;
    }
    .mt-auto {
      margin-top: auto;
    }
    h1 {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-light shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand text-primary fw-bold fs-4" href="/">Centro Visite</a>
  </div>
</nav>

<main class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4 w-100" style="max-width:900px;">
    <h1 class="fw-bold">Volontari e Tipi di Visita</h1>
    <button type="button" class="btn btn-primary btn-add px-4 py-2" th:onclick="|window.location='/register-user'|" th:disabled="${!canAddVisits}">
      + Aggiungi Volontario
    </button>
  </div>

  <div th:if="${error}" class="alert alert-danger mb-3 w-100" style="max-width:900px;" th:text="${error}"></div>

  <div th:each="volunteer : ${volunteers}" class="glass-card">
    <div class="card-header bg-primary text-white">
      <div>
        <i class="bi bi-person-fill me-2"></i>
        <span th:text="${volunteer.nickname}">Nickname</span>
      </div>
      <div>
        <button type="button" class="btn btn-danger btn-sm me-2" th:if="${volunteer.canBeRemoved}" th:attr="onclick=|removeVolunteer('${volunteer.nickname}')|">Rimuovi</button>
        <button type="button" class="btn btn-secondary btn-sm" th:if="${!volunteer.canBeRemoved}" disabled>Non rimovibile</button>
      </div>
    </div>
    <div class="card-body">
      <p th:if="${#lists.isEmpty(volunteer.visitTitles)}" class="text-muted fst-italic mb-0">Nessuna visita associata.</p>
      <ul th:if="${!#lists.isEmpty(volunteer.visitTitles)}" class="mb-0">
        <li th:each="visit : ${volunteer.visitTitles}" th:text="${visit}"></li>
      </ul>
    </div>
  </div>
</main>

<script>
  function removeVolunteer(nickname) {
    if (!confirm("Sei sicuro di voler rimuovere " + nickname + "?")) return;

    fetch("/api/users/remove-volunteer/" + nickname, { method: "DELETE" })
            .then((response) => {
              if (response.ok) {
                location.reload();
              } else {
                return response.text().then((text) => { alert("Errore: " + text); });
              }
            })
            .catch((err) => { alert("Errore di rete: " + err); });
  }
</script>
</body>
</html>
