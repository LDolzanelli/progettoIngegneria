<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <title>System Configuration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
        }

        main.container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            width: 100%;
            max-width: 900px;
        }

        .card-title {
            font-weight: 600;
        }

        .btn-lg {
            padding: 0.75rem 1.2rem;
            font-size: 1.05rem;
            border-radius: 0.75rem;
        }

        h1 {
            font-weight: 600;
        }

        p.text-muted {
            font-size: 1rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-light bg-white shadow-sm sticky-top">
    <div class="container" th:classappend="${centerBrand} ? 'justify-content-center' : ''">
        <a class="navbar-brand text-primary fw-bold fs-4" href="/">
            <i class="bi bi-building"></i> Centro Visite
        </a>
    </div>
</nav>

<main class="container text-center mt-4">
    <h1 class="mb-4">Configurazione del sistema</h1>

    <div class="glass-card mx-auto col-md-8 col-lg-6">
        <h5 class="mb-3">Cambia il numero massimo di biglietti acquistabili da una singola persona</h5>
        <p class="card-text">Valore attuale: <strong th:text="${oldMax}"></strong></p>

        <form th:action="@{/system-config}" method="post" th:object="${dto}">
            <div class="mb-3 text-start">
                <label for="newMaxNumberTickets" class="form-label">Nuovo valore massimo</label>
                <input type="number" id="newMaxNumberTickets" th:field="*{newMaxNumberTickets}" class="form-control" min="1" required/>
            </div>
            <button type="submit" class="btn btn-success w-100 btn-lg">
                <i class="bi bi-check-circle"></i> Aggiorna
            </button>
        </form>
    </div>

    <div class="glass-card mx-auto col-md-8 col-lg-6">
        <h5 class="mb-3">Escludi date del prossimo mese</h5>
        <p>Vai alla sezione dove potrai escludere le date nella quale non si effettueranno eventi per il prossimo mese.</p>
        <a href="/date-picker?mode=blocked" class="btn btn-outline-primary w-100 btn-lg">
            <i class="bi bi-calendar-x"></i> Gestisci date escluse
        </a>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
