<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>System Configuration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">

    <h1 class="mb-4 text-center">Configurazione del sistema</h1>

    <!-- Change Max Tickets Section -->
    <div class="card mb-5 shadow-sm">
        <div class="card-header bg-primary text-white">
            Cambia il numero massimo di biglietti acquistabili da una singola persona
        </div>
        <div class="card-body">
            <p class="card-text">Valore attuale:
                <strong th:text="${oldMax}"></strong>
            </p>

            <form th:action="@{/system-config}" method="post" th:object="${dto}">
                <div class="mb-3">
                    <label for="newMaxNumberTickets" class="form-label">Nuovo valore massimo</label>
                    <input type="number" id="newMaxNumberTickets" th:field="*{newMaxNumberTickets}"
                           class="form-control" min="1" required />
                </div>
                <button type="submit" class="btn btn-success">Aggiorna</button>
            </form>
        </div>
    </div>

    <!-- Excluded Dates Section -->
    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">
            Escludi date del prossimo mese
        </div>
        <div class="card-body">
            <p class="card-text">Vai alla sezione dove potrai escludere le date nella quale non si effettueranno eventi per il prossimo mese.</p>
            <a href="/system-config/excluded-dates" class="btn btn-outline-primary">Gestisci date escluse</a>
        </div>
    </div>

</div>

<!-- Bootstrap JS (optional, for features like modals if needed later) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
