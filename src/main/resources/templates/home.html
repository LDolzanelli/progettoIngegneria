<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-light shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand text-primary fw-bold fs-4" href="/">Centro Visite</a>
    </div>
</nav>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-lg rounded-4 p-4 text-center">
                <div class="card-body">
                    <h1 class="card-title mb-4 display-5" th:text="'Benvenuto, ' + ${username}">Benvenuto user</h1>
                    <p class="lead mb-4">Scegli un'opzione per continuare:</p>

                    <!-- opzioni per i configuratori -->
                    <div class="d-grid gap-3 col-6 mx-auto" th:if="${role == 'configurator'}">
                        <a href="/view-locations" class="btn btn-primary btn-lg shadow-sm">
                            Visualizza i luoghi di interesse
                        </a>
                        <a href="/system-config" class="btn btn-secondary btn-lg shadow-sm">
                            Impostazioni di sistema
                        </a>
                        <a href="/view-volunteers" class="btn btn-secondary btn-lg shadow-sm">
                            Visualizza la lista dei volontari
                        </a>
                    </div>

                    <!-- opzioni per i volontari -->

                    <div class="d-grid gap-3 col-6 mx-auto" th:if="${role == 'volunteer'}">
                        <a th:href="@{/view-visittype(volunteerId=${userId})}" class="btn btn-primary btn-lg shadow-sm">
                            Visualizza i tipi di visita a te assegnati
                        </a>
                        <a href="/date-picker?mode=available" class="btn btn-secondary btn-lg shadow-sm">
                            Dai le tue disponibilità per il mese successivo
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
