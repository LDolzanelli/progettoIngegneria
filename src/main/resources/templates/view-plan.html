<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8" />
    <title>Piano Visite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <style>

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
        }
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            width: 100%;
            max-width: 900px;
        }

        .btn-lg {
            padding: 0.75rem 1.2rem;
            font-size: 1.05rem;
            border-radius: 0.75rem;
        }

        .card-title {
            font-weight: 600;
        }

        .collapse .list-group-item {
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-light bg-white shadow-sm sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand text-primary fw-bold fs-4" href="/">
            <i class="bi bi-building"></i> Centro Visite
        </a>
    </div>
</nav>
<div class="main-content d-flex flex-column align-items-center">

    <main class="container text-center mt-5 pt-5">

        <div class="glass-card mx-auto">
            <h1>Visite disponibili</h1>
            <p class="text-muted mb-4">Visualizza il piano delle visite per il prossimo mese</p>

            <div th:if="${#lists.isEmpty(visitsByType)}">
                <p class="text-muted">Nessuna visita programmata.</p>
            </div>

            <div class="accordion" id="accordion">
                <div class="accordion-item" th:each="entry, iterStat : ${visitsByType}">

                    <h2 class="accordion-header" th:id="'heading-' + ${iterStat.index}">
                        <button class="accordion-button collapsed" type="button"
                                data-bs-toggle="collapse"
                                th:data-bs-target="'#collapse-' + ${iterStat.index}"
                                th:aria-controls="'collapse-' + ${iterStat.index}"
                                aria-expanded="false">
                            <i class="bi bi-calendar-event me-2"></i>
                            <span th:text="${entry.key}">Titolo VisitType</span>
                        </button>
                    </h2>

                    <div th:id="'collapse-' + ${iterStat.index}" class="accordion-collapse collapse"
                         th:aria-labelledby="'heading-' + ${iterStat.index}"
                         data-bs-parent="#accordion">
                        <div class="accordion-body text-start">

                            <h5 th:text="${entry.value[0].visitTypeTitle}">Titolo</h5>
                            <p th:text="${entry.value[0].visitTypeDescription}">Descrizione...</p>
                            <p><strong>Punto incontro:</strong> <span th:text="${entry.value[0].meetingPoint}">Indirizzo</span></p>
                            <p th:if="${!entry.value[0].isFree}">
                                <i class="bi bi-ticket-perforated"></i> Biglietto necessario
                            </p>

                            <ul class="list-group list-group-flush mt-3">
                                <li class="list-group-item mb-2" th:each="visit : ${entry.value}">
                                    <div th:if="${visit.status != 'Annullata'}">
                                        <span th:text="${visit.date}">01/09/2025</span> -
                                        <span th:text="${visit.startTime}">10:00</span>
                                        <span class="badge bg-primary rounded-pill ms-2"
                                              th:text="${visit.numberOfParticipants + '/' + visit.maxParticipants + ' partecipanti'}">
                                        </span>
                                        <div class="d-flex justify-content-end">
                                            <a th:href="@{/book-visit(visitId=${visit.id})}"
                                               class="btn btn-primary btn-sm ms-2 mt-2"
                                               th:classappend="${visit.numberOfParticipants >= visit.maxParticipants or visit.status == 'Confermata'} ? ' disabled opacity-50' : ''"
                                               th:attr="tabindex=${(visit.numberOfParticipants >= visit.maxParticipants or visit.status == 'Confermata') ? -1 : 0},
                                                aria-disabled=${(visit.numberOfParticipants >= visit.maxParticipants or visit.status == 'Confermata')}">
                                                <i class="bi bi-ticket-detailed"></i> PRENOTA
                                            </a>
                                        </div>
                                    </div>

                                    <div th:if="${visit.status == 'Annullata'}" class="text-muted">
                                        <span th:text="${visit.date}">01/09/2025</span>
                                        <span class="badge bg-danger ms-2">Cancellata</span>
                                    </div>
                                </li>
                            </ul>

                        </div>
                    </div>

                </div>
            </div>
        </div>

    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
