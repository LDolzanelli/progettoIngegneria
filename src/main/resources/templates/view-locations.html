<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Lista Luoghi di Interesse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
    }
    nav.navbar {
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    main.container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 2rem;
      padding-bottom: 2rem;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 1.5rem;
      padding: 2rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
      width: 100%;
      max-width: 1200px;
    }
    .card-title {
      font-weight: 600;
    }
    .btn-lg {
      padding: 0.75rem 1.2rem;
      font-size: 1.05rem;
      border-radius: 0.75rem;
    }
    .btn-sm {
      border-radius: 0.5rem;
    }
    .card-text {
      font-size: 0.95rem;
    }
    .alert-info {
      border-radius: 1rem;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-light shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand text-primary fw-bold fs-4" href="/">
      <i class="bi bi-building"></i> Centro Visite
    </a>
  </div>
</nav>

<main class="container d-flex flex-column align-items-center mt-4">
  <div class="glass-card w-100">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">Lista luoghi di interesse</h2>
      <button type="button"
              class="btn btn-success btn-lg"
              th:onclick="|window.location='/add-location'|"
              th:disabled="${!canAddVisits}">
        <i class="bi bi-plus-circle"></i> Aggiungi Luogo
      </button>
    </div>

    <div id="noLocationsMessage" class="alert alert-info text-center" style="display: none;">
      Nessun luogo di interesse disponibile al momento.
    </div>

    <div class="row w-100" id="locationsGrid"></div>
  </div>
</main>

<script>
  async function loadLocations() {
    const resp = await fetch("/api/location/list");
    if (!resp.ok) { alert("Errore nel caricamento delle locations"); return; }
    const locations = await resp.json();
    const grid = document.getElementById("locationsGrid");
    const noLocationsMessage = document.getElementById("noLocationsMessage");
    grid.innerHTML = ""; // pulisci

    if (locations.length === 0) {
      noLocationsMessage.style.display = "block";
      return;
    } else {
      noLocationsMessage.style.display = "none";
    }

    locations.forEach((loc) => {
      const address = `${loc.address.street} ${loc.address.streetNumber}, ${loc.address.town} (${loc.address.province})`;
      const cardCol = document.createElement("div");
      cardCol.className = "col-sm-6 col-md-4 col-lg-3 mb-4";
      cardCol.innerHTML = `
        <div class="glass-card d-flex flex-column h-100">
            <h5 class="card-title mb-2">${loc.name}</h5>
            <p class="card-text flex-grow-1 mb-3">${loc.description ?? ""}</p>
            <p class="card-text mb-3"><small class="text-muted">${address}</small></p>
            <div class="d-flex justify-content-between mt-auto">
                <a href="/view-visittype?locationId=${loc.id}" class="btn btn-outline-success btn-sm me-2">
                    <i class="bi bi-eye"></i> Visualizza Visite
                </a>
                <button class="btn btn-outline-danger btn-sm" onclick="deleteLocation(${loc.id})"
                    ${!loc.canBeRemoved ? "disabled" : ""}>
                    <i class="bi bi-trash"></i> Elimina
                </button>
            </div>
        </div>
        `;
      grid.appendChild(cardCol);
    });

  }

  async function deleteLocation(locationId) {
    if (!confirm("Sei sicuro di voler eliminare questo luogo di interesse?")) return;
    const resp = await fetch(`/api/location/delete/${locationId}`, { method: "DELETE" });
    if (resp.ok) {
      alert("Luogo eliminato con successo.");
      await loadLocations();
    } else {
      alert("Errore durante l'eliminazione del luogo.");
    }
  }

  window.onload = loadLocations;
</script>

</body>
</html>
