<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View Locations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Lista luoghi di interesse</h2>
        <a href="/add-location" class="btn btn-success">
            Aggiungi Luogo di interesse
        </a>
    </div>

    <div id="noLocationsMessage" class="alert alert-info text-center" style="display: none;">
        Nessun luogo di interesse disponibile al momento.
    </div>

    <div class="row" id="locationsGrid">
        <!-- Card generate da JS -->
    </div>
</div>

<script>
    async function loadLocations() {
        const resp = await fetch('/api/location/list');
        if (!resp.ok) {
            alert('Errore nel caricamento delle locations');
            return;
        }
        const locations = await resp.json();
        const grid = document.getElementById('locationsGrid');
        const noLocationsMessage = document.getElementById('noLocationsMessage');
        grid.innerHTML = ''; // pulisci

        if (locations.length === 0) {
            noLocationsMessage.style.display = 'block';
            return;
        } else {
            noLocationsMessage.style.display = 'none';
        }

        locations.forEach(loc => {
            const address = `${loc.address.street} ${loc.address.streetNumber}, ${loc.address.town} (${loc.address.province})`;

            const cardCol = document.createElement('div');
            cardCol.className = 'col-sm-6 col-md-4 col-lg-3 mb-4';

            cardCol.innerHTML = `
            <div class="card h-100 shadow-sm d-flex flex-column">
                <div class="card-body d-flex flex-column flex-grow-1">
                    <h5 class="card-title">${loc.name}</h5>
                    <p class="card-text flex-grow-1">${loc.description ?? ''}</p>
                    <p class="card-text"><small class="text-muted">${address}</small></p>
                </div>
                <div class="card-footer bg-transparent border-top-0 d-flex justify-content-between">
                    <a href="/manage-location/${loc.id}" class="btn btn-primary btn-sm">Gestisci luogo</a>
                    <a href="/view-visittype?locationId=${loc.id}" class="btn btn-outline-success btn-sm">Visualizza Visite</a>
                </div>
            </div>
        `;
            grid.appendChild(cardCol);
        });
    }

    window.onload = loadLocations;
</script>
</body>
</html>
