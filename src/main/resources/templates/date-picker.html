<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title
      th:text="${mode == 'available'} ? 'Disponibilità' : 'Calendario Date Non Utilizzabili'"
    >
      Calendario Date Non Utilizzabili
    </title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css"
      rel="stylesheet"
    />

    <style>
      .datepicker-inline {
        font-size: 1.2rem;
        width: 100%;
        display: block;
      }

      .datepicker table {
        width: 100%;
      }

      .datepicker td,
      .datepicker th {
        width: 3rem;
        height: 3rem;
        text-align: center;
        vertical-align: middle;
        font-size: 1rem;
        border-radius: 0.25rem;
      }

      .datepicker td.active,
      .datepicker td.active:hover {
        background-color: #6c757d !important;
        color: #fff;
        border-color: #6c757d !important;
        border-radius: 0.35rem;
        transition: background-color 0.2s ease-in-out,
          border-color 0.2s ease-in-out;
      }

      .datepicker table tr td.active,
      .datepicker table tr td.active:hover {
        background-image: linear-gradient(to bottom, #ec3841, #ec6a6a);
      }

      .available-mode .datepicker table tr td.active,
      .available-mode .datepicker table tr td.active:hover {
        background-image: linear-gradient(to bottom, #28a745, #7cd37c);
      }
      .datepicker td.day:hover {
        background-color: #e2e6ea;
        border-radius: 0.25rem;
      }

      .datepicker td.active.focus,
      .datepicker td.active:hover.focus {
        outline: none;
        box-shadow: none;
      }

      .datepicker {
        margin: 0 auto;
        float: none;
      }

      .datepicker-days .datepicker-switch {
        cursor: default;
      }

      .datepicker .datepicker-switch:hover {
        background-color: transparent !important;
        color: inherit !important;
      }
    </style>
  </head>

  <body th:classappend="${mode == 'available'} ? 'available-mode' : ''">
    <nav class="navbar navbar-expand-lg bg-light shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand text-primary fw-bold fs-4" href="/">
          Centro Visite
        </a>
      </div>
    </nav>

    <div class="container mb-5">
      <h1
        class="mb-4"
        th:text="${mode == 'available'} ? 'Seleziona le tue disponibilità' : 'Date precluse'"
      >
        Date precluse
      </h1>

      <div
        th:if="${mode == 'available' and !availabilityStatus}"
        class="alert alert-warning"
      >
        La raccolta delle disponibilità è attualmente chiusa. Le date
        selezionate sono in sola lettura.
      </div>

      <form id="blocked-dates-form">
        <div class="mb-3">
          <label
            class="form-label"
            th:text="${mode == 'available'} ? 'Seleziona le date disponibili' : 'Seleziona le date precluse'"
          >
            Seleziona le date precluse
          </label>
          <div id="inline-datepicker"></div>
        </div>

        <div class="gap-2 d-flex justify-content-start">
          <button
            type="submit"
            class="btn btn-primary"
            th:disabled="${mode == 'available' and !availabilityStatus}"
          >
            Invia
          </button>
        </div>
      </form>

      <div id="results" class="mt-4" style="display: none">
        <div class="alert alert-success">
          <h5>Registrazione completata con successo!</h5>
          <div id="resultContent"></div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/locales/bootstrap-datepicker.it.min.js"></script>

    <meta name="api-base-url" th:content="${apiBaseUrl}">
    <script th:inline="javascript">
      const mode = /*[[${mode}]]*/ 'blocked';
      const isReadOnly = /*[[${!availabilityStatus}]]*/ false; // true if availability collection closed
      const apiBaseUrl = document.querySelector('meta[name="api-base-url"]').content;

      function formatDateLocal(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function parseLocalDate(dateStr) {
        const [y, m, d] = dateStr.split("-").map(Number);
        return new Date(y, m - 1, d);
      }

      $(async function () {
        const API_BASE = apiBaseUrl +
                (mode === "blocked"
                ? "/blocked-dates"
                : "/volunteer-availability");

        console.log("API base = " + API_BASE);

        try {
          const monthToUpdate = await fetch(`${API_BASE}/month-to-update`)
                  .then(res => res.ok ? res.json() : Promise.reject("Errore mese"));

          const now = new Date();
          let year = now.getFullYear();
          if (monthToUpdate < now.getMonth() + 1) year += 1;

          const firstDay = new Date(year, monthToUpdate - 1, 1);
          const lastDay = new Date(year, monthToUpdate, 0);

          $("#inline-datepicker").datepicker({
            format: "yyyy-mm-dd",
            todayHighlight: false,
            multidate: true,
            orientation: "bottom auto",
            language: "it",
            maxViewMode: 0,
            defaultViewDate: firstDay,
            startDate: firstDay,
            endDate: lastDay,
            beforeShowDay: function(date) {
              if (isReadOnly && mode === "available") {
                return { enabled: false, classes: 'disabled-day' };
              }
              return true;
            }
          });

          //server per settare il mese corretto
          setTimeout(() => {
            const dp = $("#inline-datepicker").data("datepicker");
            dp.viewDate = firstDay;
            dp._fill();
          }, 0);

          const dates = await fetch(`${API_BASE}${mode === "blocked" ? "/month-dates" : "/get-own"}`)
                  .then(res => res.ok ? res.json() : []);

          if (dates.length > 0) {
            const dateObjects = dates.map(parseLocalDate);
            $("#inline-datepicker").datepicker("setDate", dateObjects);
          }

          let selectedDates = dates;

          if (!(isReadOnly && mode === "available")) {
            $("#inline-datepicker").on("changeDate", function () {
              selectedDates = $("#inline-datepicker").datepicker("getDates").map(formatDateLocal);
              console.log("Date selezionate:", selectedDates);
            });
          }

          $("#blocked-dates-form").on("submit", async function (e) {
            e.preventDefault();

            const payload = { dateList: selectedDates };

            const response = await fetch(
                    `${API_BASE}${mode === "blocked" ? "/set" : "/update-own"}`,
                    {
                      method: mode === "blocked" ? "POST" : "PUT",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify(payload),
                    }
            );

            if (response.ok) {
              alert(
                      mode === "blocked"
                              ? "Date bloccate aggiornate con successo!"
                              : "Disponibilità aggiornata con successo!"
              );
            } else {
              alert("Errore: " + (await response.text()));
            }
          });

        } catch (err) {
          alert("Errore caricamento dati: " + err);
        }
      });
    </script>
  </body>
</html>
