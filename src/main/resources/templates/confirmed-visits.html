<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Le tue visite confermate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
      min-height: 100vh;
    }
    .table-container {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    h1 {
      font-weight: 600;
    }
    .btn-primary {
      font-weight: 500;
    }
    .table th, .table td {
      vertical-align: middle;
    }
  </style>
</head>
<body>
<div class="container py-5">
  <h1 class="mb-4 text-center">Le tue visite confermate</h1>

  <div class="table-container table-responsive">
    <table class="table table-striped table-hover shadow-sm mb-0">
      <thead class="table-light text-center">
      <tr>
        <th>Data</th>
        <th>Ora</th>
        <th>Tipo Visita</th>
        <th>Luogo</th>
        <th>Stato</th>
        <th>Partecipanti</th>
        <th>Dettagli</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="visit : ${visits}" class="text-center">
        <td th:text="${visit.date}"></td>
        <td th:text="${visit.startTime}"></td>
        <td th:text="${visit.visitTypeTitle}"></td>
        <td th:text="${visit.locationName}"></td>
        <td th:text="${visit.status}"></td>
        <td th:text="${visit.numberOfParticipants}"></td>
        <td>
          <a th:href="@{/visit-details/{id}(id=${visit.id})}" class="btn btn-primary btn-sm">Visualizza</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="text-center mt-4">
    <a th:href="@{/}" class="btn btn-secondary">Torna alla Home</a>
  </div>
</div>
</body>
</html>
