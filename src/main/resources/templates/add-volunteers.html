<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aggiungi Volontari</title>
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
  />
  <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
  />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
      padding-top: 4rem;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 1.5rem;
      padding: 2.5rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 700px;
      margin-bottom: 3rem;
    }

    h2, h4 {
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .btn-lg {
      padding: 0.85rem 1.2rem;
      font-size: 1.1rem;
      border-radius: 0.75rem;
    }

    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 10;
    }

    .list-group-item {
      border-radius: 0.5rem;
    }

    a.btn-link {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand text-primary fw-bold fs-4" href="/">
      <i class="bi bi-building"></i> Centro Visite
    </a>
  </div>
</nav>

<main class="container d-flex justify-content-center mt-5 pt-5">
  <div class="glass-card">
    <h2>Gestione volontari per il tipo di visita</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <h4>Volontari associati</h4>
    <ul class="list-group mb-4">
      <li class="list-group-item" th:each="v : ${assignedVolunteers}" th:text="${v}">MarioRossi</li>
      <li class="list-group-item" th:if="${assignedVolunteers.isEmpty()}">Nessun volontario assegnato</li>
    </ul>

    <h4>Aggiungi volontario</h4>
    <form method="post" th:action="@{|/add-volunteers?visitTypeId=${visitTypeId}|}">
      <div class="mb-3">
        <label for="volunteerNickname" class="form-label">Seleziona volontario</label>
        <select id="volunteerNickname" name="volunteerNickname" class="form-select">
          <option th:each="vol : ${allVolunteers}" th:value="${vol.nickname}" th:text="${vol.nickname}"></option>
        </select>
        <a href="/register-user" class="btn btn-link p-0 mt-2">+ Aggiungi nuovo volontario</a>
      </div>

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary btn-lg">
          <i class="bi bi-person-plus-fill"></i> Aggiungi
        </button>
      </div>
    </form>
  </div>
</main>
</body>
</html>
