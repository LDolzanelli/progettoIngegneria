<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cambia credenziali</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container">
      <div class="row justify-content-center mt-5">
        <div class="col-12 col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="card-title mb-3 text-center">
                Aggiorna le credenziali
              </h1>
              <p class="text-center mb-4">
                Al primo accesso, devono essere modificate le credenziali
              </p>

              <form method="post" th:action="@{/change-credentials}">
                <div class="mb-3">
                  <label for="newUsernameField" class="form-label">Nome utente:</label>

                  <input
                          type="text"
                          class="form-control"
                          id="newUsernameField"
                          name="newUsername"
                          th:if="${role == 'configurator'}"
                          th:value="${username}"
                          required
                  />

                  <input
                          type="text"
                          class="form-control"
                          id="newUsernameFieldDisabled"
                          name="newUsernameDisplay"
                          th:if="${role == 'volunteer'}"
                          th:value="${username}"
                          disabled
                  />
                  <input
                          type="hidden"
                          name="newUsername"
                          th:if="${role == 'volunteer'}"
                          th:value="${username}" />
                </div>

                <div class="mb-3">
                  <label for="oldPassword" class="form-label"
                    >Password attuale:</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="oldPassword"
                    name="oldPassword"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="newPassword" class="form-label"
                    >Nuova password:</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="newPassword"
                    name="newPassword"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="confirmPassword" class="form-label"
                    >Conferma password:</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="confirmPassword"
                    name="confirmPassword"
                    required
                  />
                </div>

                <div
                  th:if="${error}"
                  class="alert alert-danger"
                  role="alert"
                  th:text="${error}"
                ></div>

                <button type="submit" class="btn btn-primary w-100">
                  Salva
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
