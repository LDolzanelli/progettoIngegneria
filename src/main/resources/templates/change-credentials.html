<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cambia credenziali</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
      padding: 2rem;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 1.5rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      width: 100%;
      max-width: 450px;
    }

    h1 {
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .form-label {
      font-weight: 500;
    }

    .btn-primary {
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="glass-card">
  <h1 class="text-center">Aggiorna le credenziali</h1>
  <p class="text-center mb-4">Al primo accesso, devono essere modificate le credenziali</p>

  <form method="post" th:action="@{/change-credentials}">
    <div class="mb-3">
      <label for="newUsernameField" class="form-label">Nome utente:</label>

      <!-- Configurator può modificare username -->
      <input
              type="text"
              class="form-control"
              id="newUsernameField"
              name="newUsername"
              th:if="${role == 'configurator'}"
              th:value="${username}"
              required
      />

      <!-- Volunteer vede username disabilitato -->
      <input
              type="text"
              class="form-control"
              id="newUsernameFieldDisabled"
              name="newUsernameDisplay"
              th:if="${role == 'volunteer'}"
              th:value="${username}"
              disabled
      />
      <input
              type="hidden"
              name="newUsername"
              th:if="${role == 'volunteer'}"
              th:value="${username}" />
    </div>

    <div class="mb-3">
      <label for="oldPassword" class="form-label">Password attuale:</label>
      <input type="password" class="form-control" id="oldPassword" name="oldPassword" required/>
    </div>

    <div class="mb-3">
      <label for="newPassword" class="form-label">Nuova password:</label>
      <input type="password" class="form-control" id="newPassword" name="newPassword" required/>
    </div>

    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Conferma password:</label>
      <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required/>
    </div>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <button type="submit" class="btn btn-primary w-100">Salva</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
