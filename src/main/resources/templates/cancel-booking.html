<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8"/>
    <title>Disdici Prenotazione</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
            padding-top: 4rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .alert {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<div class="glass-card">
    <h1 class="text-center">Disdici una Prenotazione</h1>

    <div id="message" class="alert d-none text-center"></div>

    <div class="mb-4">
        <h5 class="mb-3">Inserisci il Codice</h5>
        <div class="input-group mb-3">
            <input type="text" id="bookingCode" class="form-control" placeholder="Es. ABC123">
            <button id="loadDetailsBtn" class="btn btn-primary"><i class="bi bi-search"></i> Carica Dettagli</button>
        </div>
    </div>

    <div id="bookingDetails" class="d-none">
        <h5 class="text-primary mb-3">Dettagli Prenotazione</h5>
        <div class="table-responsive mb-3">
            <table class="table table-bordered">
                <tbody>
                <tr><th>Utente</th><td id="userName"></td></tr>
                <tr><th>Visitatori</th><td id="visitors"></td></tr>
                <tr><th>Tipo Visita</th><td id="visitType"></td></tr>
                <tr><th>Luogo</th><td id="location"></td></tr>
                <tr><th>Data</th><td id="visitDate"></td></tr>
                </tbody>
            </table>
        </div>
        <button id="cancelBtn" class="btn btn-danger w-100"><i class="bi bi-x-circle"></i> Disdici Prenotazione</button>
    </div>

    <a th:href="@{/}" class="btn btn-secondary w-100 mt-4"><i class="bi bi-arrow-left"></i> Torna alla Home</a>
</div>

<script th:inline="javascript">
    const userId = /*[[${userId}]]*/ 0;
    const username = /*[[${username}]]*/ "";

    document.addEventListener("DOMContentLoaded", function () {
        const loadDetailsBtn = document.getElementById("loadDetailsBtn");
        const cancelBtn = document.getElementById("cancelBtn");
        const bookingDetailsDiv = document.getElementById("bookingDetails");
        const messageDiv = document.getElementById("message");

        function showMessage(message, type) {
            messageDiv.textContent = message;
            messageDiv.className = `alert alert-${type} text-center`;
            messageDiv.classList.remove("d-none");
        }

        loadDetailsBtn.addEventListener("click", function () {
            const bookingCode = document.getElementById("bookingCode").value.trim();
            if (!bookingCode) {
                showMessage("Inserisci un codice di prenotazione.", "danger");
                bookingDetailsDiv.classList.add("d-none");
                return;
            }

            fetch(`/api/booking/booking-details/${bookingCode}`)
                .then(response => {
                    if (!response.ok) throw new Error("Prenotazione non trovata.");
                    return response.json();
                })
                .then(data => {
                    if (data.userId !== userId) {
                        bookingDetailsDiv.classList.add("d-none");
                        throw new Error("Non puoi annullare questa prenotazione: non sei il proprietario.");
                    }

                    document.getElementById("userName").textContent = data.userName;
                    document.getElementById("visitors").textContent = data.visitorsNames.join(", ");
                    document.getElementById("visitType").textContent = data.visitTypeName;
                    document.getElementById("location").textContent = data.locationName;
                    document.getElementById("visitDate").textContent = data.visitDate;

                    bookingDetailsDiv.classList.remove("d-none");
                    showMessage("Dettagli caricati con successo.", "info");
                })
                .catch(error => {
                    showMessage(error.message, "danger");
                });
        });

        cancelBtn.addEventListener("click", function () {
            const bookingCode = document.getElementById("bookingCode").value.trim();

            fetch("/api/booking/cancel", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ bookingCode: bookingCode, userId: userId })
            })
                .then(response => {
                    if (!response.ok) return response.text().then(text => { throw new Error(text); });
                    return response.text();
                })
                .then(successMsg => {
                    showMessage(successMsg, "success");
                    bookingDetailsDiv.classList.add("d-none");
                    document.getElementById("bookingCode").value = "";
                })
                .catch(error => {
                    showMessage(error.message, "danger");
                });
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
